<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour toi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #F7DCE0;
    --blush-deep: #F3C4CC;
    --lavender: #E7D9F2;
    --rose: #E8919F;
    --rose-deep: #D9707F;
    --cream-paper: #FFF9F5;
    --ink: #6B4A52;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: linear-gradient(150deg, var(--blush) 0%, var(--lavender) 55%, var(--blush-deep) 100%);
  }

  .floaters {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .floater {
    position: absolute;
    bottom: -10%;
    font-size: 1.4rem;
    color: rgba(232, 145, 159, 0.45);
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    from { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }

  .stage {
    position: relative;
    z-index: 1;
    width: min(90vw, 420px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .envelope-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .envelope-wrap:hover {
    transform: translateY(-4px);
  }

  .hint {
    position: absolute;
    bottom: -2.4rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.95rem;
    color: var(--ink);
    opacity: 0.7;
    white-space: nowrap;
    animation: pulse 2s ease-in-out infinite;
    transition: opacity 0.4s ease;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.9; }
  }

  .envelope {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: var(--cream-paper);
    box-shadow: 0 18px 40px rgba(180, 110, 125, 0.28);
    overflow: visible;
  }

  .env-body {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: linear-gradient(160deg, #FFFDFB 0%, #FCEEF1 100%);
    z-index: 1;
  }

  .env-body::before,
  .env-body::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 52%;
    height: 100%;
    background: #F6D9DF;
    z-index: 1;
  }

  .env-body::before {
    left: 0;
    clip-path: polygon(0 100%, 0 0, 100% 100%);
  }

  .env-body::after {
    right: 0;
    clip-path: polygon(100% 100%, 100% 0, 0 100%);
  }

  .env-flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 62%;
    background: linear-gradient(160deg, var(--rose) 0%, var(--rose-deep) 100%);
    clip-path: polygon(0 0, 100% 0, 50% 90%);
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(.6,-0.1,.25,1);
    z-index: 3;
    border-radius: 10px 10px 0 0;
  }

  .stage.open .env-flap {
    transform: rotateX(180deg);
  }

  .seal {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 15%;
    aspect-ratio: 1;
    background: radial-gradient(circle at 35% 30%, #F0A0AE, var(--rose-deep));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(150, 60, 75, 0.35);
    z-index: 4;
    transition: opacity 0.3s ease, transform 0.4s ease;
  }

  .seal::before {
    content: "♥";
    color: #FFF3F4;
    font-size: 0.9rem;
  }

  .stage.open .seal {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.4);
  }

  .hearts-deco {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .hearts-deco span {
    position: absolute;
    color: var(--rose);
    opacity: 0.55;
    font-size: 0.85rem;
  }

  .letter {
    position: absolute;
    left: 6%;
    right: 6%;
    top: 8%;
    bottom: -6%;
    background: var(--cream-paper);
    border-radius: 8px;
    box-shadow: 0 10px 26px rgba(180, 110, 125, 0.22);
    z-index: 2;
    transform: translateY(0) scale(0.98);
    transition: transform 0.9s cubic-bezier(.2,.8,.25,1) 0.15s, box-shadow 0.6s ease 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.6rem;
    text-align: center;
  }

  .stage.open .letter {
    transform: translateY(-58%) scale(1);
    box-shadow: 0 22px 46px rgba(180, 110, 125, 0.32);
  }

  .letter-inner {
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.6s ease 0.7s, transform 0.6s ease 0.7s;
  }

  .stage.open .letter-inner {
    opacity: 1;
    transform: translateY(0);
  }

  .letter h2 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: clamp(1.15rem, 4.4vw, 1.5rem);
    line-height: 1.4;
    color: var(--ink);
    margin-bottom: 1.4rem;
  }

  .buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    position: relative;
    min-height: 3.2rem;
  }

  .btn {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    padding: 0.7rem 1.8rem;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn-yes {
    background: var(--rose-deep);
    color: #FFF6F7;
    box-shadow: 0 8px 20px rgba(217, 112, 127, 0.35);
  }

  .btn-yes:hover {
    transform: translateY(-2px) scale(1.03);
  }

  .btn-no {
    background: transparent;
    color: var(--ink);
    border: 2px solid #E3B9C0;
    position: relative;
  }

  .btn:focus-visible {
    outline: 3px solid var(--rose-deep);
    outline-offset: 3px;
  }

  .answer {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
  }

  .answer.show {
    display: flex;
  }

  .answer p {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.3rem, 5.5vw, 1.9rem);
    color: var(--rose-deep);
    line-height: 1.35;
  }

  .answer .big-heart {
    font-size: 2rem;
    color: var(--rose-deep);
    animation: beat 1.1s ease-in-out infinite;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .confetti-heart {
    position: fixed;
    top: -5%;
    font-size: 1.2rem;
    color: var(--rose-deep);
    opacity: 0.9;
    animation: fall linear forwards;
    z-index: 5;
    pointer-events: none;
  }

  @keyframes fall {
    to {
      transform: translateY(115vh) rotate(360deg);
      opacity: 0;
    }
  }

  @media (max-width: 380px) {
    .letter h2 { font-size: 1.05rem; }
    .btn { padding: 0.6rem 1.4rem; font-size: 0.92rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .floater, .confetti-heart, .answer .big-heart, .hint { animation: none; }
    .env-flap, .letter, .letter-inner { transition-duration: 0.01ms; }
  }
</style>
</head>
<body>

  <div class="floaters" id="floaters"></div>

  <div class="stage" id="stage">
    <div class="envelope-wrap" id="envelopeWrap">
      <div class="envelope">
        <div class="letter" id="letter">
          <div class="letter-inner" id="letterInner">
            <div class="question" id="question">
              <h2>Veux-tu qu'on reprenne sur de bonnes bases ?</h2>
              <div class="buttons">
                <button class="btn btn-yes" id="btnYes" type="button">Oui</button>
                <button class="btn btn-no" id="btnNo" type="button">Non</button>
              </div>
            </div>
            <div class="answer" id="answer">
              <p>Je t'aime mon amour</p>
              <div class="big-heart">♥</div>
            </div>
          </div>
        </div>
        <div class="env-body"></div>
        <div class="hearts-deco" id="heartsDeco"></div>
        <div class="env-flap"></div>
        <div class="seal"></div>
      </div>
      <div class="hint" id="hint">touche l'enveloppe</div>
    </div>
  </div>

<script>
  const floaters = document.getElementById('floaters');
  const symbols = ['♥', '♡'];
  for (let i = 0; i < 16; i++) {
    const el = document.createElement('span');
    el.className = 'floater';
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (0.9 + Math.random() * 1.3) + 'rem';
    const duration = 9 + Math.random() * 10;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = (-Math.random() * duration) + 's';
    floaters.appendChild(el);
  }

  const heartsDeco = document.getElementById('heartsDeco');
  const decoPositions = [
    { top: '12%', left: '10%' }, { top: '18%', left: '85%' },
    { top: '78%', left: '8%' }, { top: '82%', left: '88%' },
    { top: '8%', left: '48%' }
  ];
  decoPositions.forEach(pos => {
    const s = document.createElement('span');
    s.textContent = '♥';
    s.style.top = pos.top;
    s.style.left = pos.left;
    heartsDeco.appendChild(s);
  });

  const stage = document.getElementById('stage');
  const envelopeWrap = document.getElementById('envelopeWrap');
  const hint = document.getElementById('hint');
  const btnYes = document.getElementById('btnYes');
  const btnNo = document.getElementById('btnNo');
  const question = document.getElementById('question');
  const answer = document.getElementById('answer');

  envelopeWrap.addEventListener('click', () => {
    if (stage.classList.contains('open')) return;
    stage.classList.add('open');
    hint.style.opacity = '0';
  });

  btnYes.addEventListener('click', (e) => {
    e.stopPropagation();
    question.style.display = 'none';
    answer.classList.add('show');
    launchConfetti();
  });

  function dodge() {
    const wrap = btnNo.closest('.buttons');
    const maxX = wrap.clientWidth - btnNo.clientWidth;
    const maxY = 40;
    const x = Math.random() * maxX - maxX / 2;
    const y = Math.random() * maxY - maxY / 2;
    btnNo.style.position = 'relative';
    btnNo.style.transform = `translate(${x}px, ${y}px)`;
  }

  btnNo.addEventListener('mouseenter', dodge);
  btnNo.addEventListener('click', (e) => {
    e.stopPropagation();
    e.preventDefault();
    dodge();
  });
  btnNo.addEventListener('touchstart', (e) => {
    e.preventDefault();
    dodge();
  }, { passive: false });

  function launchConfetti() {
    const count = 28;
    for (let i = 0; i < count; i++) {
      const heart = document.createElement('span');
      heart.className = 'confetti-heart';
      heart.textContent = '♥';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (0.8 + Math.random() * 1.4) + 'rem';
      heart.style.animationDuration = (2.5 + Math.random() * 2) + 's';
      heart.style.animationDelay = (Math.random() * 0.6) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5500);
    }
  }
</script>
</body>
</html>
